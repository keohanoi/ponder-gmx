# PostgreSQL Configuration for GMX Indexer
# Optimized for indexing workloads with high write throughput

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# Memory Settings
shared_buffers = 256MB              # 25% of RAM for containers with 1GB RAM
effective_cache_size = 768MB        # 75% of RAM
work_mem = 4MB                     # Per query memory
maintenance_work_mem = 64MB        # For maintenance operations
dynamic_shared_memory_type = posix

# Checkpoint Settings (optimized for write-heavy workloads)
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 1GB

# Write-Ahead Logging
wal_level = replica
archive_mode = on
archive_command = '/bin/true'      # Disable actual archiving in dev
max_wal_senders = 3
wal_keep_size = 128MB

# Query Planning
random_page_cost = 1.1            # SSD optimization
effective_io_concurrency = 200    # SSD optimization
seq_page_cost = 1.0

# Background Writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 512kB

# Autovacuum (important for indexing workloads)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.1

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000  # Log queries taking more than 1 second
log_line_prefix = '%t [%p-%l] %q%u@%d '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 10MB

# Replication
hot_standby = on
wal_receiver_timeout = 60s
wal_sender_timeout = 60s

# Performance Monitoring
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl
# stats_temp_directory was deprecated in PostgreSQL 15+
# The stats collector now uses shared memory instead

# Locale and Formatting
datestyle = 'iso, mdy'
timezone = 'UTC'
default_text_search_config = 'pg_catalog.english'

# Security
ssl = off                         # Enable in production with proper certificates
password_encryption = scram-sha-256