# Production Override Configuration

services:
  # Production PostgreSQL with optimizations
  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres-prod.conf:/etc/postgresql/postgresql.conf
      - ./backups:/backups
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Production Redis with persistence
  redis:
    restart: always
    volumes:
      - redis_prod_data:/data
      - ./docker/redis-prod.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Production indexer
  gmx-indexer:
    restart: always
    build:
      target: production
    environment:
      NODE_ENV: production
      PONDER_LOG_LEVEL: ${PONDER_LOG_LEVEL:-info}
    volumes:
      - ./logs:/app/logs:rw
      - prod_data:/app/data
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:42069/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Production Nginx with SSL
  nginx:
    restart: always
    volumes:
      - ./docker/nginx/nginx-prod.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_prod_logs:/var/log/nginx
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Production Prometheus with retention
  prometheus:
    restart: always
    volumes:
      - ./docker/prometheus/prometheus-prod.yml:/etc/prometheus/prometheus.yml
      - prometheus_prod_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Production Grafana
  grafana:
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SECURITY_ALLOW_EMBEDDING: false
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Production backup service
  backup:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./docker/scripts:/scripts:ro
    command: >
      sh -c "
        while true; do
          sleep 86400;
          pg_dump -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} | gzip > /backups/backup_$(date +%Y%m%d_%H%M%S).sql.gz;
          find /backups -name '*.sql.gz' -mtime +7 -delete;
        done
      "
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 256M

  # Log rotation service
  logrotate:
    image: alpine:latest
    restart: "no"
    volumes:
      - ./logs:/logs
      - nginx_prod_logs:/nginx_logs
    command: >
      sh -c "
        while true; do
          find /logs -name '*.log' -size +100M -exec gzip {} \;
          find /logs -name '*.gz' -mtime +7 -delete;
          find /nginx_logs -name '*.log' -size +100M -exec gzip {} \;
          find /nginx_logs -name '*.gz' -mtime +7 -delete;
          sleep 86400;
        done
      "

volumes:
  postgres_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/gmx-indexer/postgres-data

  redis_prod_data:
    driver: local

  prod_data:
    driver: local

  prometheus_prod_data:
    driver: local

  grafana_prod_data:
    driver: local

  nginx_prod_logs:
    driver: local