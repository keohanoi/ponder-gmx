services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gmx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gmx_indexer}
      POSTGRES_USER: ${POSTGRES_USER:-gmx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gmx_password_change_me}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=1GB
      - -c
      - max_connections=200
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=1000
      - -c
      - track_io_timing=on
      - -c
      - track_functions=pl
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gmx_user} -d ${POSTGRES_DB:-gmx_indexer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gmx-network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: gmx-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gmx-network

  # GMX Indexer (Ponder Application)
  gmx-indexer:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: gmx-indexer
    restart: unless-stopped
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-gmx_user}:${POSTGRES_PASSWORD:-gmx_password_change_me}@postgres:5432/${POSTGRES_DB:-gmx_indexer}

      # RPC Configuration
      PONDER_RPC_URL_5003: ${PONDER_RPC_URL_5003:-https://rpc.sepolia.mantle.xyz}

      # Application Configuration
      NODE_ENV: ${NODE_ENV:-production}
      PONDER_PORT: ${PONDER_PORT:-42069}
      PONDER_LOG_LEVEL: ${PONDER_LOG_LEVEL:-info}

      # Security
      PONDER_SECRET: ${PONDER_SECRET:-change_this_secret_key}

      # Redis
      REDIS_URL: redis://redis:6379

      # Monitoring
      PONDER_METRICS_PORT: ${PONDER_METRICS_PORT:-9090}

    volumes:
      - ./logs:/app/logs
      - ponder_data:/app/data
    ports:
      - "${PONDER_PORT:-42069}:42069"
      - "${PONDER_METRICS_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:42069/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - gmx-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gmx-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - gmx-indexer
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gmx-network

  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: gmx-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - gmx-indexer
    networks:
      - gmx-network

  # Grafana for Monitoring Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: gmx-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_change_me}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - gmx-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ponder_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  gmx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16