# Simplified Monitoring Stack - Prometheus & Grafana only

services:
  # PostgreSQL exporter for database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: gmx-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - gmx-network

  # Redis exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: gmx-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    depends_on:
      - redis
    networks:
      - gmx-network

networks:
  gmx-network:
    external: true
    name: ponder-gmx_gmx-network